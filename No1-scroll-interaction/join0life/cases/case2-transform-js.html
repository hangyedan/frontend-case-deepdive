<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Case 2 — transform/opacity + JS scroll</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Apple SD Gothic Neo", sans-serif;
    background: #0e0e12;
    color: #eee;
  }
  #fps-meter {
    position: fixed; top: 12px; left: 12px; z-index: 999;
    background: rgba(0,0,0,0.7); padding: 8px 14px; border-radius: 8px;
    font-size: 14px; font-variant-numeric: tabular-nums;
  }
  #fps-meter b { color: #ffb84d; }
  .badge {
    position: fixed; top: 12px; right: 12px; z-index: 999;
    background: #ffb84d; color: #2a1a00; padding: 8px 14px;
    border-radius: 8px; font-size: 13px; font-weight: 700;
  }
  .intro {
    height: 90vh; display: flex; flex-direction: column;
    justify-content: center; align-items: center; text-align: center; padding: 24px;
  }
  .intro h1 { font-size: 1.8rem; margin-bottom: 12px; }
  .intro p { max-width: 560px; line-height: 1.6; color: #aaa; }
  .intro code { color: #ffd9a0; }
  .pipeline {
    margin-top: 20px; font-size: 0.85rem; color: #ffb84d;
    background: rgba(255,184,77,0.1); padding: 10px 16px; border-radius: 8px;
  }
  .section {
    height: 100vh; display: flex; align-items: center; justify-content: center;
    position: relative; border-top: 1px solid #222;
  }
  .card {
    width: 320px;
    height: 200px;
    background: linear-gradient(135deg, #ffb84d, #ffe08a);
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.2rem;
    color: #2a1a00;
    will-change: transform, opacity;
  }
</style>
</head>
<body>

<div class="badge">CASE 2 — transform/opacity + JS</div>
<div id="fps-meter">FPS: <b id="fps-value">--</b></div>

<div class="intro">
  <h1>Case 2 — transform/opacity 변경 + scroll 이벤트</h1>
  <p>
    scroll 이벤트 핸들러와 <code>getBoundingClientRect()</code>는 Case 1과 동일하게 그대로 씁니다.
    달라지는 건 딱 하나, 애니메이션 대상 속성을 <code>transform</code> / <code>opacity</code>로 바꾼 것뿐입니다.
  </p>
  <div class="pipeline">JS(메인 스레드) → Style(메인 스레드) → Composite(컴포지터 스레드) — Layout/Paint 생략, 단 JS 실행 자체는 여전히 메인 스레드</div>
</div>

<script>
  const SECTION_COUNT = 24;
  for (let i = 0; i < SECTION_COUNT; i++) {
    const section = document.createElement('section');
    section.className = 'section';
    const card = document.createElement('div');
    card.className = 'card';
    card.textContent = `Section ${i + 1}`;
    section.appendChild(card);
    document.body.appendChild(section);
  }

  const cards = Array.from(document.querySelectorAll('.card'));

  // Case 1과 동일한 scroll 이벤트 + getBoundingClientRect 방식.
  // 유일한 차이: style.top/width 대신 transform/opacity만 사용.
  function onScroll() {
    const vh = window.innerHeight;
    cards.forEach((card) => {
      const rect = card.getBoundingClientRect();
      const progress = Math.min(Math.max((vh - rect.top) / (vh + rect.height), 0), 1);
      const translateY = (1 - progress) * 60;
      const scale = 0.8 + progress * 0.2;
      card.style.transform = `translateY(${translateY}px) scale(${scale})`;
      card.style.opacity = progress;
    });
  }
  window.addEventListener('scroll', onScroll);
  onScroll();

  const fpsValueEl = document.getElementById('fps-value');
  let frames = 0;
  let lastTime = performance.now();
  function measureFps(now) {
    frames++;
    if (now - lastTime >= 500) {
      const fps = Math.round((frames * 1000) / (now - lastTime));
      fpsValueEl.textContent = fps;
      fpsValueEl.style.color = fps < 45 ? '#ff5c5c' : '#5cff8f';
      frames = 0;
      lastTime = now;
    }
    requestAnimationFrame(measureFps);
  }
  requestAnimationFrame(measureFps);
</script>

</body>
</html>
